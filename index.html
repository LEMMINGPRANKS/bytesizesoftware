<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wildcraft</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="game-root"></div>
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="hotbar"></div>
  <div id="status">
    <span id="fps">0</span> fps · <span id="pos">0,0,0</span>
  </div>
  <div id="target-info" class="hidden"></div>
</div>
<div id="version-tag">0.18</div>
<div id="craft-panel" class="hidden">
  <h2>Crafting</h2>
  <div id="recipe-list"></div>
  <button id="craft-close">Close [E]</button>
</div>
<div id="inv-panel" class="hidden">
  <h2>Inventory</h2>
  <div id="inv-grid"></div>
  <div id="inv-hotbar"></div>
  <button id="inv-close">Close [Tab]</button>
</div>
<div id="chest-panel" class="hidden">
  <h2>Chest</h2>
  <div id="chest-grid"></div>
  <h3 style="font-size:16px;">You</h3>
  <div id="chest-player-grid"></div>
  <div id="chest-player-hotbar"></div>
  <button id="chest-close">Close [E]</button>
</div>
<div id="resume-overlay" class="hidden">
  <h2>Paused</h2>
  <p>Click anywhere to resume</p>
  <button id="exit-world-btn">Save &amp; Exit World</button>
  <button id="open-settings-pause">Settings</button>
</div>
<div id="settings-panel" class="hidden">
  <h2>Settings</h2>
  <div class="setting-row">
    <label>Render distance: <span id="rd-val">3</span> chunks</label>
    <input id="set-render-distance" type="range" min="2" max="8" step="1" value="3">
  </div>
  <div class="setting-row">
    <label>Resolution scale:</label>
    <div class="seg" id="set-pixel-ratio">
      <button data-v="0.5">0.5×</button>
      <button data-v="0.75">0.75×</button>
      <button data-v="1">1.0×</button>
    </div>
  </div>
  <div class="setting-row">
    <label>Antialias <em>(reload to apply)</em>:</label>
    <label class="switch"><input type="checkbox" id="set-antialias"><span></span></label>
  </div>
  <div class="setting-row">
    <label>Fog:</label>
    <label class="switch"><input type="checkbox" id="set-fog" checked><span></span></label>
  </div>
  <div class="setting-row" style="gap:8px;">
    <button id="settings-apply">Apply</button>
    <button id="settings-close">Close</button>
  </div>
  <p id="settings-note" class="hidden">Settings saved.</p>
</div>
<div id="start-screen">
  <h1>Wildcraft</h1>
  <p>WASD move · Space jump · Mouse look · Left click mine/attack · Right click/Q place/eat · 1-9 hotbar · E craft · Tab inventory</p>
  <h2>Pick a World</h2>
  <div id="world-list"></div>
  <div id="new-world-form" class="hidden">
    <h3>New World</h3>
    <label>Name: <input id="new-world-name" type="text" maxlength="20" placeholder="Cool World"></label>
    <div style="display:flex;gap:20px;font-size:18px;margin-top:8px;">
      <label><input type="radio" name="newmode" value="survival" checked> Survival</label>
      <label><input type="radio" name="newmode" value="creative"> Creative (fly + infinite blocks)</label>
    </div>
    <div style="margin-top:8px;display:flex;gap:8px;">
      <button id="new-world-create">Create</button>
      <button id="new-world-cancel">Cancel</button>
    </div>
  </div>
  <div id="boot-status">Loading…</div>
  <button id="open-settings-start">Settings</button>
</div>
<div id="error-overlay" style="position:fixed;bottom:0;left:0;right:0;background:#400;color:#fff;padding:10px;font-family:monospace;font-size:13px;display:none;z-index:100;"></div>
<script type="importmap">
{
  "imports": {
    "three": "./assets/three.module.js"
  }
}
</script>
<script>
// Surface any module-loading or runtime error so it's never silent.
window.addEventListener("error", (e) => {
  const el = document.getElementById("error-overlay");
  if (el) {
    el.style.display = "block";
    el.textContent = "Error: " + (e.message || "(unknown)") +
      (e.filename ? "  (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "");
  }
});
window.addEventListener("unhandledrejection", (e) => {
  const el = document.getElementById("error-overlay");
  if (el) {
    el.style.display = "block";
    el.textContent = "Promise rejection: " + (e.reason?.message || e.reason || "(unknown)");
  }
});
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
