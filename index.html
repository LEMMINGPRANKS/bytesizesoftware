<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wildcraft</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="game-root"></div>
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="hotbar"></div>
  <div id="status">
    <span id="fps">0</span> fps · <span id="pos">0,0,0</span>
  </div>
  <div id="target-info" class="hidden"></div>
</div>
<div id="craft-panel" class="hidden">
  <h2>Crafting</h2>
  <div id="recipe-list"></div>
  <button id="craft-close">Close [E]</button>
</div>
<div id="resume-overlay" class="hidden">
  <h2>Paused</h2>
  <p>Click anywhere to resume</p>
</div>
<div id="start-screen">
  <h1>Wildcraft</h1>
  <p>Click to play. WASD move, Space jump, Mouse look.</p>
  <p>Left click: mine · Right click or Q: place selected · 1-9: hotbar · E: craft</p>
  <button id="start-btn" onclick="window.__playClicked=true; document.getElementById('boot-status').textContent='Play clicked — initializing…';">Play</button>
  <div id="boot-status">Loading…</div>
</div>
<div id="error-overlay" style="position:fixed;bottom:0;left:0;right:0;background:#400;color:#fff;padding:10px;font-family:monospace;font-size:13px;display:none;z-index:100;"></div>
<script type="importmap">
{
  "imports": {
    "three": "./assets/three.module.js"
  }
}
</script>
<script>
// Surface any module-loading or runtime error so it's never silent.
window.addEventListener("error", (e) => {
  const el = document.getElementById("error-overlay");
  if (el) {
    el.style.display = "block";
    el.textContent = "Error: " + (e.message || "(unknown)") +
      (e.filename ? "  (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "");
  }
});
window.addEventListener("unhandledrejection", (e) => {
  const el = document.getElementById("error-overlay");
  if (el) {
    el.style.display = "block";
    el.textContent = "Promise rejection: " + (e.reason?.message || e.reason || "(unknown)");
  }
});
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
